name: Produzione catalogo

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Costruisci solo gli SKU che contengono questo testo (vuoto = tutto)"
        required: false
        default: ""
      copy:
        description: "Motore per i testi delle inserzioni"
        type: choice
        options: [template, claude]
        default: template
      force:
        description: "Ricostruisci anche i prodotti invariati"
        type: boolean
        default: false
  push:
    branches: ["**"]
    tags: ["v*"]  # i filtri sui percorsi non si applicano ai tag
    paths: ["catalog/**", "factory/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Librerie di sistema per WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -e ".[ai]"

      # Cache di dist/: i prodotti invariati non vengono ricostruiti.
      - uses: actions/cache@v6
        with:
          path: dist
          key: dist-${{ hashFiles('catalog/**', 'factory/**') }}-${{ inputs.copy || 'template' }}
          restore-keys: dist-

      - name: Produci il catalogo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          args="--copy ${{ inputs.copy || 'template' }}"
          if [ -n "${{ inputs.only }}" ]; then args="$args --only ${{ inputs.only }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          python -m factory -v build $args

      - name: Pacchetto pronto da caricare
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-${{ github.run_number }}
          path: |
            dist/catalog.csv
            dist/gumroad-payhip.csv
            dist/*/*/*.zip
            dist/*/*/images/*.jpg
            dist/*/*/listing.txt
            dist/*/*/manifest.json
          retention-days: 30

      - name: Release con gli ZIP (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/catalog.csv
            dist/*/*/*.zip
