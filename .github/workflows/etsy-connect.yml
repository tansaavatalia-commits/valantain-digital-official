name: Collega Etsy

# Da avviare a mano due volte:
#  1) senza «risposta»: il riepilogo del job mostra il link per autorizzare l'app sul tuo negozio
#  2) incollando in «risposta» l'indirizzo completo su cui Etsy ti ha rimandato
on:
  workflow_dispatch:
    inputs:
      risposta:
        description: "Passo 2: incolla qui l'indirizzo completo della pagina dopo l'autorizzazione (vuoto = passo 1)"
        required: false
        default: ""

permissions:
  contents: write

concurrency: etsy-connect

jobs:
  connect:
    runs-on: ubuntu-latest
    env:
      REDIRECT_URI: https://github.com/${{ github.repository }}
      ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
      ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install httpx pydantic pyyaml cryptography && pip install --no-deps -e .

      - name: Controllo dei secret
        run: |
          missing=""
          for s in ETSY_KEYSTRING ETSY_SHARED_SECRET; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then echo "::error::Mancano i secret:$missing"; exit 1; fi

      - name: Passo 1 - link di autorizzazione
        if: inputs.risposta == ''
        run: |
          url=$(python -m factory etsy-start --redirect-uri "$REDIRECT_URI")
          {
            echo "## Collega il tuo negozio Etsy"
            echo
            echo "1. Apri questo link e premi **Grant access / Consenti**:"
            echo
            echo "   $url"
            echo
            echo "2. Etsy ti riporta su GitHub. Copia l'indirizzo **completo** dalla barra del browser (contiene \`code=\`)."
            echo "3. Avvia di nuovo questo workflow incollandolo nel campo **risposta**. Hai circa 10 minuti."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Passo 2 - salva il collegamento
        if: inputs.risposta != ''
        env:
          RISPOSTA: ${{ inputs.risposta }}
        run: |
          python -m factory etsy-finish --redirect-uri "$REDIRECT_URI" --response "$RISPOSTA" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Fatto: il pilota automatico ora può pubblicare." >> "$GITHUB_STEP_SUMMARY"

      - name: Salva lo stato cifrato
        if: always()
        run: |
          git config user.name "valantain-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Collegamento Etsy: stato cifrato"
          git push
