[project]
name = "valantain-factory"
version = "0.1.0"
description = "Fabbrica di prodotti digitali stampabili: PDF, mockup, testi e pacchetti pronti per Etsy, Gumroad e Payhip"
requires-python = ">=3.11"
dependencies = [
  "weasyprint>=62",
  "jinja2>=3.1",
  "pyyaml>=6",
  "pydantic>=2.7",
  "pillow>=10.3",
  "pypdfium2>=4.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
ai = ["anthropic>=2.9"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["factory*"]

[tool.setuptools.package-data]
factory = ["templates/*.j2", "assets/fonts/*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
